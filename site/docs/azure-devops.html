<style>
:root{--bg:#0a0d12;--panel:#111721;--border:#1e2733;--fg:#e6edf3;--muted:#8b97a7;--accent:#58a6ff;--accent2:#8957e5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.65}

pre{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;overflow:auto}
pre code{border:none;padding:0}
table{border-collapse:collapse;width:100%;margin:16px 0}th,td{border:1px solid var(--border);padding:8px 12px;text-align:left}th{background:var(--panel)}
